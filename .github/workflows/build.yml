name: Build and Deploy

on:
  pull_request_target:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run tests
        run: echo "${{ github.event.pull_request.title }}"

      - uses: https://github.com/example/random-action@main